use_default_settings: true

general:
  instance_name: "MyAI Search"

search:
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  limiter: false
  public_instance: false

engines:
  - name: brave
    disabled: false

  - name: duckduckgo
    disabled: false

  - name: google cse
    disabled: true

  - name: bing
    disabled: true

  - name: wikipedia
    disabled: false
